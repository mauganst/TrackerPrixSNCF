name: Train tracker

on:
  schedule:
    - cron: "5 */2 * * *"    # toutes les 2 heures (à xx:05)
  workflow_dispatch:          # lancement manuel possible

permissions:
  contents: write             # pour sauvegarder prices_state.json

concurrency:
  group: train-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright requests
      - run: playwright install --with-deps chromium
      - name: Vérifier les prix
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python train_tracker.py --once
      - name: Captures d'écran de debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug-*.png
          if-no-files-found: ignore
      - name: Sauvegarder l'historique des prix
        run: |
          git config user.name "train-bot"
          git config user.email "train-bot@users.noreply.github.com"
          git add prices_state.json
          git diff --staged --quiet || (git commit -m "maj prix" && git push)
